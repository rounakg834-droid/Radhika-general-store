<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist | Radhika General Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f8f8;
            color: #222;
        }

        header {
            background: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        header h1 {
            color: #d63384;
            font-size: 25px;
        }

        .back-btn {
            text-decoration: none;
            background: #d63384;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .wishlist-container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .wishlist-container h2 {
            margin-bottom: 25px;
            font-size: 28px;
        }

        #wishlistProducts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .wishlist-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #eee;
        }

        .wishlist-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f5f5f5;
        }

        .wishlist-info {
            padding: 18px;
        }

        .wishlist-info small {
            color: #777;
        }

        .wishlist-info h3 {
            margin: 8px 0;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #d63384;
        }

        .old-price {
            margin-left: 8px;
            color: #999;
            text-decoration: line-through;
        }

        .buttons {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .buttons button {
            border: none;
            padding: 10px;
            border-radius: 7px;
            cursor: pointer;
            flex: 1;
        }

        .cart-btn {
            background: #d63384;
            color: white;
        }

        .remove-btn {
            background: #eee;
            color: #333;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 50px 20px;
            border-radius: 15px;
            font-size: 18px;
        }

        @media (max-width: 900px) {
            #wishlistProducts {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            #wishlistProducts {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Radhika General Store</h1>

        <a href="../index.html" class="back-btn">
            ← Continue Shopping
        </a>
    </header>


    <div class="wishlist-container">

        <h2>❤️ My Wishlist</h2>

        <div id="wishlistProducts"></div>

    </div>


    <script>

        function loadWishlist() {

            const wishlist =
                JSON.parse(localStorage.getItem("wishlist")) || [];

            const container =
                document.getElementById("wishlistProducts");

            container.innerHTML = "";


            if (wishlist.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        ❤️ Your Wishlist is Empty
                        <br><br>
                        Add some products to your wishlist!
                    </div>
                `;

                return;
            }


            wishlist.forEach(function(product) {

                const card =
                    document.createElement("div");

                card.className = "wishlist-card";


                card.innerHTML = `

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >

                    <div class="wishlist-info">

                        <small>
                            ${product.brand || ""}
                        </small>

                        <h3>
                            ${product.name}
                        </h3>

                        <span class="price">
                            ₹${product.price}
                        </span>

                        <span class="old-price">
                            ₹${product.oldPrice || ""}
                        </span>

                        <div class="buttons">

                            <button
                                class="cart-btn"
                                onclick="addToCart(${product.id})"
                            >
                                🛒 Add to Cart
                            </button>

                            <button
                                class="remove-btn"
                                onclick="removeWishlist(${product.id})"
                            >
                                ❌ Remove
                            </button>

                        </div>

                    </div>
                `;


                container.appendChild(card);

            });

        }



        function removeWishlist(productId) {

            let wishlist =
                JSON.parse(localStorage.getItem("wishlist")) || [];


            wishlist =
                wishlist.filter(function(product) {

                    return product.id !== productId;

                });


            localStorage.setItem(
                "wishlist",
                JSON.stringify(wishlist)
            );


            loadWishlist();

        }



        function addToCart(productId) {

            const wishlist =
                JSON.parse(localStorage.getItem("wishlist")) || [];


            const product =
                wishlist.find(function(item) {

                    return item.id === productId;

                });


            if (!product) return;


            let cart =
                JSON.parse(localStorage.getItem("cart")) || [];


            const existingProduct =
                cart.find(function(item) {

                    return item.name === product.name;

                });


            if (existingProduct) {

                existingProduct.quantity =
                    (existingProduct.quantity || 1) + 1;

            } else {

                cart.push({

                    name: product.name,
                    price: Number(product.price),
                    image: product.image,
                    quantity: 1

                });

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            alert("Product added to cart!");

        }



        loadWishlist();

    </script>

</body>
</html>
