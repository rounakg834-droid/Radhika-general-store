<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed | Radhika General Store</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .success-box {
            background: white;
            width: 90%;
            max-width: 550px;
            text-align: center;
            padding: 50px 30px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .check {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .cod {
            margin: 25px 0;
            padding: 15px;
            background: #fff0f7;
            border-radius: 10px;
            font-weight: bold;
        }

        .home-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 30px;
            background: #d63384;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .home-btn:hover {
            background: #b5266d;
        }

    </style>

</head>

<body>

    <div class="success-box">

        <div class="check">
            ✅
        </div>

        <h1>Order Placed Successfully!</h1>

        <p>
            Thank you for shopping with
            <strong>Radhika General Store</strong>.
        </p>

        <div class="cod">
            💵 Payment Method: Cash on Delivery
        </div>

        <p>
            Your order details have been sent to our WhatsApp.
        </p>

        <p>
            We will contact you to confirm your order.
        </p>

        <a href="../index.html">Continue Shopping</a>
    </div>

</body>

</html>
