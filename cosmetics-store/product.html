<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | Radhika General Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 6%;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 5px 0 0;
            color: #ccc;
        }

        .product-details {
            max-width: 1100px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .product-image {
            width: 100%;
            height: 500px;
            border-radius: 12px;
            overflow: hidden;
            background: #f5f5f5;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 20px 0;
        }

        .brand {
            color: #888;
            font-size: 15px;
        }

        .product-info h2 {
            font-size: 32px;
            margin: 10px 0 20px;
        }

        .description {
            color: #555;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
        }

        .old-price {
            color: #999;
            text-decoration: line-through;
            margin-left: 10px;
        }

        .category {
            margin-top: 20px;
            color: #555;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
        }

        .quantity-box button {
            width: 40px;
            height: 40px;
            border: 1px solid #ddd;
            background: white;
            font-size: 20px;
            cursor: pointer;
            border-radius: 6px;
        }

        #quantity {
            font-size: 18px;
            font-weight: bold;
        }

        .add-cart {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .add-cart:hover {
            background: #d63384;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #111;
            text-decoration: none;
        }

        @media (max-width: 700px) {

            .product-details {
                grid-template-columns: 1fr;
                margin: 20px;
                padding: 20px;
            }

            .product-image {
                height: 350px;
            }

            .product-info h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Radhika General Store</h1>
        <p>Beauty • Cosmetics • Accessories</p>
    </header>


    <div class="product-details">

        <div class="product-image">
            <img id="productImage" src="" alt="Product">
        </div>


        <div class="product-info">

            <div class="brand" id="brand"></div>

            <h2 id="productName"></h2>

            <p class="description" id="description"></p>

            <div>
                <span class="price" id="price"></span>
                <span class="old-price" id="oldPrice"></span>
            </div>

            <p class="category">
                Category:
                <strong id="category"></strong>
            </p>


            <div class="quantity-box">

                <button onclick="decreaseQuantity()">−</button>

                <span id="quantity">1</span>

                <button onclick="increaseQuantity()">+</button>

            </div>


            <button class="add-cart" onclick="addToCart()">
                Add to Cart
            </button>


            <a href="index.html" class="back">
                ← Continue Shopping
            </a>

        </div>

    </div>


    <script type="module">

        const urlParams = new URLSearchParams(window.location.search);

const productId = Number(urlParams.get("id"));

// Firebase connect
const { db } = await import("./firebase-config.js");

const { collection, getDocs } =
    await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js");

// Firebase se products lao
const snapshot = await getDocs(
    collection(db, "products")
);

let product = null;

snapshot.forEach(function(doc) {

    const data = doc.data();

    if (String(data.id) === String(productId)) {
        product = data;
    }

});

if (!product) {

    document.body.innerHTML = `
        <h2 style="text-align:center;margin-top:100px;">
            Product Not Found
        </h2>

        <p style="text-align:center;">
            <a href="../index.html">
                Back to Store
            </a>
        </p>
    `;

} else {

    document.getElementById("productImage").src =
        product.image;

    document.getElementById("brand").textContent =
        product.brand;

    document.getElementById("productName").textContent =
        product.name;

    document.getElementById("description").textContent =
        product.description;

    document.getElementById("price").textContent =
        "₹" + product.price;

    document.getElementById("oldPrice").textContent =
        "₹" + product.oldPrice;

    document.getElementById("category").textContent =
        product.category;

}


        let quantity = 1;


        function increaseQuantity() {

            quantity++;

            document.getElementById("quantity").textContent =
                quantity;

        }


        function decreaseQuantity() {

            if (quantity > 1) {

                quantity--;

            }

            document.getElementById("quantity").textContent =
                quantity;

        }


        function addToCart() {

            if (!product) return;


            let cart =
                JSON.parse(localStorage.getItem("cart")) || [];


            const existingProduct =
                cart.find(function (item) {

                    return item.name === product.name;

                });


            if (existingProduct) {

                existingProduct.quantity =
                    (existingProduct.quantity || 1) + quantity;

            } else {

                cart.push({

                    name: product.name,

                    price: product.price,

                    image: product.image,

                    quantity: quantity

                });

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            alert("Product added to cart!");

        }

    </script>

</body>

</html>
